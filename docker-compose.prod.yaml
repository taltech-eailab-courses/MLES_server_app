services:
  mles-app:
    image: 0taki0/mles_app:latest
    entrypoint: ["sh", "/app/scripts/docker-entrypoint.sh"]
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5001:5000"
    # Robot-planner model: downloaded on first start into the model-cache volume, then reused.
    environment: &model_env
      ROBOT_PLANNER_URL: ${ROBOT_PLANNER_URL:-}
      ROBOT_PLANNER_SHA256: ${ROBOT_PLANNER_SHA256:-}
      ROBOT_PLANNER_GGUF: /data/models/robot-q4_k_m.gguf
    volumes:
      - model-cache:/data/models
      - ./scripts:/app/scripts:ro
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]
    networks:
      internal:
        aliases: [app]

        
  mles-app-jetson:
    image: 0taki0/mles_app:jetson
    entrypoint: ["sh", "/app/scripts/docker-entrypoint.sh"]
    command: ["python3", "app.py"]
    runtime: nvidia
    environment:
      <<: *model_env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - model-cache:/data/models
      - ./scripts:/app/scripts:ro
    ports:
      - "5000:5000"
    networks:
      internal:
        aliases: [app]

  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - mles-app
      # - mles-app-jetson
    volumes:
      - ./.ngrok/ngrok-traffic-policy.yml:/etc/ngrok/traffic-policy.yml:ro
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: >
      http http://app:5000
      --url=http://taltech-mles-app.ngrok.io
    networks: [internal]
    ports:
      - "4040:4040"
      - "443:443"
      - "80:80"

networks:
  internal:
    driver: bridge

volumes:
  model-cache:
